# Smoke fixture — exercises the .codemaster.yaml repo-config feature
# (merged in PR #187 / repo-config-wiring). Every block below is asserted
# by tests/smoke/_config_assertions.py against the live review output.
#
# Sub-features demonstrated:
#   * path_filters       — file selection (last-match-wins). The
#                          `generated/` exclude means
#                          `generated/schema_pb2.py` (seeded in the PR
#                          diff, full of bait) is NOT reviewed → 0
#                          findings on it.
#   * path_instructions  — per-glob team rule. The Django rule makes the
#                          reviewer flag `models.py`'s `.save()`-without-
#                          `.full_clean()` — a finding that does NOT fire
#                          without this config.
#   * knowledge.file_patterns — discovers `TEAM_GUIDELINES.md` (not an
#                          A-1 default pattern) so the policy engine
#                          extracts + can cite its rule.
#   * knowledge.confluence.include_labels — narrows Confluence retrieval
#                          to the platform label the seeded SEP corpus is
#                          tagged with (asserted flag-gated, alongside the
#                          existing confluence citation check).
#   * config-change notice — because THIS file is in the PR diff, the
#                          workflow emits a category=config advisory.

schema_version: 1
enabled: true
severity_min: nit

# Last-match-wins: review everything, then carve out generated code.
path_filters:
  - "**"
  - "!**/generated/**"

# Per-glob team review rules. The Django rule is the bait for
# path-instructions coverage: models.py calls .save() with no preceding
# .full_clean(), which only surfaces because of this rule.
path_instructions:
  - path: "**/*.py"
    instructions: |
      Enforce this team's Django conventions:
        - Every `model.save()` call MUST be preceded by a
          `model.full_clean()` call so validation runs before the
          write. Flag any `.save()` without a preceding
          `.full_clean()`.

knowledge:
  enabled: true
  # Additive to the 15 A-1 default guideline-file patterns. Lets the
  # policy engine discover the repo's team-guidelines doc.
  file_patterns:
    - "TEAM_GUIDELINES.md"
  confluence:
    # Narrow Confluence retrieval to the platform-exposed label the
    # seeded SEP corpus is tagged with. include_labels can only narrow
    # the platform ceiling, never elevate.
    include_labels:
      - "security"
